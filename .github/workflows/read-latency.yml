            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D7 admin-four tier-C clone latency
        run: |
          bash scripts/measure-d7-latency.sh 2>&1 | tee d7-latency.log
          {
            echo "## D7 latency (stub-core, median ns/op)"
            echo '```'
            cat d7-latency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D8 session-resolver tier-C clone latency
        run: |
          bash scripts/measure-d8-latency.sh 2>&1 | tee d8-latency.log
          {
            echo "## D8 latency (stub-core, median ns/op)"
            echo '```'
            cat d8-latency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D9 OIDC tier-C clone latency
        run: |
          bash scripts/measure-d9-latency.sh 2>&1 | tee d9-latency.log
          {
