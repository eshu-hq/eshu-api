# eshu-api Leaf B read-latency gate (Refs eshu-hq/eshu#9669, part of
# eshu-hq/eshu#6707).
#
# Owns the read-latency comparison the destination census assigns the
# satellite: the terminated Native-now wave (D2), the terminated
# admin/identity/recovery reads (D3), the terminated Native-next
# reads (D4), the terminated D6 Status + SupplyChain reads, the
# gap-04 terminated Compare POST, the D7
# admin-four tier-C clones, the D8 session-resolver tier-C clones,
# the D9 OIDC-login, GitHub-login, and SAML-login tier-C clones, and
# the D10 terminated setup-state GET plus W7-writers setup trio,
# the Wave-1 terminated Freshness reads, the Wave-2 terminated
# Content point reads, the W4 terminated Content search reads, the
# W4 Code search terminated reads, the W7-read terminated admin
# sign-in-policy GET, the W7-writers terminated admin sign-in-policy
# PATCH, the W3 IaC-6 terminated legs, and the dead-code 3 terminated legs
# must not regress past 1.50x of the generic byte-relay on the
# hermetic stub-core legs (scripts/measure-leafb-latency.sh,
# scripts/measure-d3-latency.sh, scripts/measure-d4-latency.sh,
# scripts/measure-d6-latency.sh, scripts/measure-compare-latency.sh,
# scripts/measure-d7-latency.sh,
# scripts/measure-d8-latency.sh, scripts/measure-d9-latency.sh,
# scripts/measure-d9github-latency.sh,
# scripts/measure-d9saml-latency.sh,
# scripts/measure-setup-latency.sh,
# scripts/measure-freshness-latency.sh,
# scripts/measure-content-latency.sh,
# scripts/measure-content-search-latency.sh,
# scripts/measure-signinpolicy-admin-read-latency.sh,
# scripts/measure-signinpolicy-admin-write-latency.sh,
# scripts/measure-code-flow-latency.sh,
# scripts/measure-code-search-latency.sh,
# scripts/measure-code-graph-latency.sh,
# scripts/measure-code-divergence-latency.sh,
# scripts/measure-drift-latency.sh,
# scripts/measure-iac-latency.sh,
# scripts/measure-dead-code-latency.sh).
# The pinned-core-image leg against a real deployment rides flip prep
# (D11); this gate runs hermetically on every lane-affecting PR, on
# main pushes, and weekly.
#
# Pinned actions (re-verify with git ls-remote when auditing):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
# The Go toolchain comes from the runner with the go.mod toolchain
# directive resolving the version; no third-party setup action is
# introduced for one hermetic script.

name: read-latency

on:
  pull_request:
    paths:
      - 'api/**'
      - 'internal/**'
      - 'cmd/**'
      - 'openapi/**'
      - 'go.mod'
      - 'scripts/measure-leafb-latency.sh'
      - 'scripts/measure-d3-latency.sh'
      - 'scripts/measure-d4-latency.sh'
      - 'scripts/measure-d6-latency.sh'
      - 'scripts/measure-compare-latency.sh'
      - 'scripts/measure-d7-latency.sh'
      - 'scripts/measure-d8-latency.sh'
      - 'scripts/measure-d9-latency.sh'
      - 'scripts/measure-d9github-latency.sh'
      - 'scripts/measure-d9saml-latency.sh'
      - 'scripts/measure-setup-latency.sh'
      - 'scripts/measure-freshness-latency.sh'
      - 'scripts/measure-content-latency.sh'
      - 'scripts/measure-content-search-latency.sh'
      - 'scripts/measure-signinpolicy-admin-read-latency.sh'
      - 'scripts/measure-signinpolicy-admin-write-latency.sh'
      - 'scripts/measure-code-flow-latency.sh'
      - 'scripts/measure-code-search-latency.sh'
      - 'scripts/measure-code-graph-latency.sh'
      - 'scripts/measure-code-divergence-latency.sh'
      - 'scripts/measure-drift-latency.sh'
      - 'scripts/measure-iac-latency.sh'
      - 'scripts/measure-dead-code-latency.sh'
      - '.github/workflows/read-latency.yml'
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC, with govulncheck/gosec
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  read-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Leaf B terminated-vs-relay latency
        run: |
          bash scripts/measure-leafb-latency.sh 2>&1 | tee latency.log
          {
            echo "## Leaf B latency (stub-core, median ns/op)"
            echo '```'
            cat latency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D3 terminated-vs-relay latency
        run: |
          bash scripts/measure-d3-latency.sh 2>&1 | tee d3-latency.log
          {
            echo "## D3 latency (stub-core, median ns/op)"
            echo '```'
            cat d3-latency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D4 terminated-vs-relay latency
        run: |
          bash scripts/measure-d4-latency.sh 2>&1 | tee d4-latency.log
          {
            echo "## D4 latency (stub-core, median ns/op)"
            echo '```'
            cat d4-latency.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: D6 terminated-vs-relay latency
        run: |
          bash scripts/measure-d6-latency.sh 2>&1 | tee d6-latency.log
          {
            echo "## D6 latency (stub-core, median ns/op)"
            echo '```'
