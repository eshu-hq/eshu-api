# eshu-api CI gates (Refs eshu-hq/eshu-api#1, part of eshu-hq/eshu#6707).
#
# Thin caller: a `changes` job classifies paths, `parity` is this repo's own
# lane, a `lanes` job runs the shared lane bodies inside the pinned
# eshu-hq/.github reusable, and `ci-complete` aggregates. `ci-complete` is
# the ONLY context a ruleset requires (org contract). The effective lane set
# inside `lanes` is lint, test, race, shell, image, govulncheck, gosec,
# actionlint; the inner names appear as `lanes / <lane>`.
#
# Lane bodies come from
# eshu-hq/.github/.github/workflows/go-collector-ci.yml pinned to the v2
# commit SHA (the peeled tag, never the mutable tag). Each run-* input
# below is the exact expression the retired inline lane used as its `if:`.
# `changes` has no `if:` guard on purpose: every lane needs it, so skipping
# it on a schedule run would skip every lane.
#
# Kept in this repo, not in the reusable:
# - `parity` (scripts/check-parity.sh) is api-specific, so it stays a
#   separate job beside `lanes`, with its retired gate, and is a ci-complete
#   need.
# - The `image` lane maps onto the reusable image inputs: a plain
#   `docker build` of ./Dockerfile on the amd64 runner (no push), which
#   keeps the build-only, linux/amd64 semantics. Tag pushes and main still
#   ship through .github/workflows/release.yml, not here.
#
# Accepted deltas of the move (documented, not silent):
# - gosec SARIF no longer uploads to the Security tab (the reusable runs on
#   a read-only token for fork safety); findings ride the 14-day artifact.
#   Scheduled runs now fail the lane when findings exist
#   (gosec-fail-on-findings), where the retired step only counted them.
# - Scheduled govulncheck/gosec no longer open or update a tracking issue
#   (no reusable hook yet); a red scheduled run replaces it and triage rides
#   the run page. The issues: write / security-events: write job grants go
#   with them.
# - The `go.mod` presence probe is gone: go.mod has landed, so the lanes
#   never go dormant.
# - The coverage artifact no longer sets if-no-files-found: error, and the
#   summary posts the last 30 `go tool cover -func` lines (the floor check
#   still fails the lane below COVERAGE_FLOOR).
# - golangci-lint is installed with `go install` at the same version
#   instead of golangci-lint-action. The 500-line cap scans every .go file
#   under the tree via find (including contracts/upstream/**, all under the
#   cap today) instead of `git ls-files`.
# - actionlint runs from the sha256-checked 1.7.12 tarball instead of the
#   rhysd/actionlint action, so PR annotations from the action's problem
#   matcher are gone; the findings stay in the lane log.
# - shellcheck runs from the reusable's ludeeus/action-shellcheck pin
#   (2.0.0, 00cae500...) instead of the repo's former master pin.
# - Tool pins that are inputs here: golangci-lint v2.12.2, govulncheck
#   v1.9.0 (run with -scan package, Go 1.26 SSA-safe), gosec v2.30.0
#   (newer than the reusable default v2.27.1, held at the retired pin),
#   actionlint 1.7.12 (sha256 8aca8db9...a3d8, tarball-verified).
# - workflow_dispatch still runs no lane (every retired gate keyed on push,
#   schedule, or pull_request); unchanged by the move.
#
# Skeleton state: this repo holds versioned contracts, parity evidence,
# and its first Go increment (HTTP skeleton: router, auth, v1 alias and
# deprecation, read-contract client, health/readyz binary).
# contracts/upstream/** holds byte-exact source copies (parity evidence,
# not build inputs): the nested module marker in that directory keeps the
# parent toolchain from loading them, and they stay excluded from the `go`
# path class so parity bumps never pay for Go lanes.
#
# The coverage ratchet is live: coverage-floor sits at the measured total
# (past the 90% finish line), is pinned equal to the Makefile by
# ci_workflow_test.go, and may only rise. Dependabot (gomod and
# github-actions, weekly grouped) proposes bumps; the reusable pin moves by
# a reviewed commit, with the contract test updated alongside it.
#
# Pinned actions (SHAs synced with the uses: lines below; re-verify with
# git ls-remote when auditing):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   eshu-hq/.github go-collector-ci v2   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Every other action runs inside the reusable at that same pin.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: govulncheck + gosec only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on a sibling satellite post-merge run).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      parity: ${{ steps.filter.outputs.parity }}
      workflows: ${{ steps.filter.outputs.workflows }}
      image: ${{ steps.filter.outputs.image }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - '!contracts/upstream/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Files tests open or go:embed reaches (Eshu #9200 lesson:
              # JSON under code paths is code). Proven per entry when the
              # first fixture lands; until then the group stays stable.
              - 'testdata/**'
              - '**/*.json'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.example.*'
              - '!.github/**'
              - '!.golangci.yml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            parity:
              # Byte-exact upstream copies plus the script and pin record
              # that prove them; never build inputs (see docs/provenance.md).
              - 'contracts/upstream/**'
              - 'scripts/check-parity.sh'
              - 'docs/provenance.md'
            workflows:
              - '.github/workflows/**'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            misc:
              # Anything not classified above runs the full Go lanes.
              # Docs-only must keep skipping, so the docs skip set stays
              # negated here; every classified pattern is negated too so
              # narrow lanes (fixtures/shell/parity) keep their shape.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.json'
              - '!**/*.yaml'
              - '!**/*.yml'
              - '!**/*.example.*'
              - '!**/*.sh'
              - '!contracts/upstream/**'
              - '!scripts/check-parity.sh'
              - '!docs/provenance.md'
              - '!.github/workflows/**'
              - '!Dockerfile'
              - '!.dockerignore'

  parity:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.parity == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contract parity vs pinned source
        run: bash scripts/check-parity.sh

  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: eshu-api
      go-version-file: go.mod
      # Measured after the coverage-90 increment (#1): 96.5% of statements,
      # past the 90% finish line. May only rise; pinned equal to the
      # Makefile by TestCoverageFloorParity.
      coverage-floor: 96.5
      # Pin every tool the retired lanes pinned; the reusable defaults float
      # across tags and this move must neither downgrade nor silently
      # upgrade a scanner.
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-test: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-race: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-shell: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.shell == 'true') }}
      # Build-only image proof (Refs eshu-hq/eshu-api#3, eshu-hq/eshu#9520):
      # bare docker build of ./Dockerfile, no push, no tag.
      run-image: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.image == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.misc == 'true')) }}
      image-context: .
      # No boundary gate in this repo: the lane stays off.
      run-boundary: false
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true')) }}
      # Findings fail scheduled runs so triage stays loud; PR and push runs
      # stay advisory green.
      gosec-fail-on-findings: ${{ github.event_name == 'schedule' }}
      run-actionlint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') }}

  ci-complete:
    needs: [changes, parity, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job objects never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Never change this shape without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
