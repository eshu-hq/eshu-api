# eshu-api release (Refs eshu-hq/eshu#9520, part of eshu-hq/eshu#6707).
#
# Pushes to main and tags `v*` publish `ghcr.io/eshu-hq/eshu-api` images
# with SLSA provenance, an SPDX SBOM, SBOM attestation, and a Trivy
# vulnerability gate. Version-tag pushes additionally cut a GitHub Release
# carrying the SBOM. PRs never push: the `image` lane in ci.yml proves the
# Dockerfile still builds, and this workflow pushes only on push events
# (main branch or version tag). Publish steps gate on the push event (not
# the ref type), so a manual dispatch on any ref, tag or branch, builds
# without pushing and proves the workflow itself still works. Pushes to
# main publish the moving main, latest, and sha-<full-sha> tags with the
# same provenance, SBOM, and attestation hardening as version-tag releases.
#
# A tag run first refuses any tag that is not vMAJOR.MINOR.PATCH[-prerelease]
# or that does not point at the protected main head. Both guards run before
# login, build, push, attestation, scan, and Release, so a stray v* tag
# publishes nothing. The guards apply to manual dispatch on a tag as well.
#
# Pinned actions (re-verify with git ls-remote when auditing; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   docker/setup-buildx-action v3        8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action v3               c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/metadata-action v5            c299e40c65443455700f0fdfc63efafe5b349051
#   docker/build-push-action v6          10e90e3645eae34f1e60eeb005ba3a3d33f178e8
#   actions/attest-build-provenance v2   96b4a1ef7235a096b17240c259729fdd70c83d45
#   actions/attest v4                    1e69f48acb82d1966a394da916b4c1698aa569d6
#   anchore/sbom-action v0               e22c389904149dbc22b58101806040fa8d37a610
#   aquasecurity/trivy-action 0.36.0     a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
#   softprops/action-gh-release v2       3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
#   actions/download-artifact v4         d3f86a106a0bac45b974a628896c90dbdf5c8093
#   actions/upload-artifact v7.0.2       cf430e030ddbb5b0abf93d22962f4752f3646cd9

name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Require a semantic version tag
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag '${TAG_NAME}' is not vMAJOR.MINOR.PATCH[-prerelease]" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tag to point at the protected main head
        if: github.ref_type == 'tag'
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          git fetch origin main --quiet
          main_head="$(git rev-parse origin/main)"
          if [[ "${TAG_COMMIT}" != "${main_head}" ]]; then
            echo "tag '${TAG_NAME}' points at ${TAG_COMMIT}, not the protected main head ${main_head}" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tag events)
        id: meta-tag
        if: github.ref_type == 'tag'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
      - name: Extract metadata (main-branch pushes)
        id: meta-branch
        if: github.ref_type == 'branch'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
      - name: Compute source date epoch
        id: epoch
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - name: Pin deterministic labels
        id: labels
        run: |
          CREATED="$(date -u -d "@${{ steps.epoch.outputs.epoch }}" '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n%s\n' '${{ steps.meta-tag.outputs.labels }}' '${{ steps.meta-branch.outputs.labels }}' > /tmp/labels.txt
          sed -i '/^[[:space:]]*$/d' /tmp/labels.txt
          sed -i "s|org\\.opencontainers\\.image\\.created=.*|org.opencontainers.image.created=${CREATED}|" /tmp/labels.txt
          { echo 'labels<<EOF'; cat /tmp/labels.txt; echo 'EOF'; } >> "${GITHUB_OUTPUT}"
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          provenance: false
          tags: |
            ${{ steps.meta-tag.outputs.tags }}
            ${{ steps.meta-branch.outputs.tags }}
          labels: ${{ steps.labels.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name == 'push' && env.IMAGE_PLATFORMS || 'linux/amd64' }}
      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Prepare SBOM output
        if: github.event_name == 'push'
        run: mkdir -p dist
      - name: Generate image SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/eshu-api-image.spdx.json
          artifact-name: eshu-api-image-spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Generate SBOM attestation
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: dist/eshu-api-image.spdx.json
          push-to-registry: true
      - name: Verify image attestations
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_IMAGE_REF: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}"
          gh attestation verify "${OCI_IMAGE_REF}" -R "${GITHUB_REPOSITORY}" \
            --predicate-type https://spdx.dev/Document/v2.3

  trivy:
    needs: [build-and-push]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Upload Trivy SARIF on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results.sarif
          path: trivy-results.sarif
          retention-days: 14
          if-no-files-found: error

  github-release:
    needs: [build-and-push, trivy]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eshu-api-image-spdx.json
          path: dist
      - name: Cut GitHub Release with SBOM
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/eshu-api-image-spdx.json
          generate_release_notes: true
          body: |
            Image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}`
            Provenance and SBOM attestations are attached to the image in GHCR.
            Scan: Trivy HIGH/CRITICAL gate passed on this digest.
